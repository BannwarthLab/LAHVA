  script:
    - mkdir -p containers
    - if [ ! -e "containers/20.4-cuda-11-8-gcc-9.sif" ] ; then apptainer build containers/20.4-cuda-11-8-gcc-9.sif apptainer_recipe/20.4-cuda-11.8-gcc-9.def ; fi


