ubuntu-gcc-openblas:       # This job runs in the build stage, which runs first.
  stage: build
  parallel: !reference [.matrix-gcc-cpu,parallel]
  cache:
    key: "gcc-$CI_COMMIT_REF_SLUG-$GCC"
    paths:
      - containers/
  dependencies:
    - build-ubuntu
  variables:
    IMAGE_NAME: ""
    CONTAINER_NAME: "containers/$DISTRIBUTION-gcc-$GCC.sif"
    APPTAINER_EXEC_ARGS: "" 
  tags:
    - cpu
  script:
    - !reference [.cpu_prep, script]
    - update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-$GCC 100 --slave /usr/bin/gfortran gfortran /usr/bin/gfortran-$GCC --slave /usr/bin/gcov gcov /usr/bin/gcov-$GCC --slave /usr/bin/g++ g++ /usr/bin/g++-$GCC
    - export CC=gcc CXX=g++
    - meson setup _build --buildtype=debug -Dlapack=openblas
    - !reference [.meson_compile, script]
    - meson test
  artifacts:
    when: on_failure
    paths:
      - _build/meson-logs/*,txt

